name: Tests

on:
  push:
    branches:
      - main
      - "redesign/**"
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements.txt

      - name: Check Python compilation
        run: python -m compileall -q app.py components database locales pages services utils

      - name: Run test suite
        env:
          OPENAI_API_KEY: ""
          DATABASE_PATH: data/ci-test.db
        run: python -m pytest --cov=services --cov=database --cov-report=term-missing
