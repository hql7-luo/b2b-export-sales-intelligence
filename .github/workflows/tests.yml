name: Tests

on:
  push:
    branches:
      - main
      - "redesign/**"
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run test suite
        env:
          OPENAI_API_KEY: ""
          DATABASE_PATH: data/ci-test.db
        run: python -m pytest
